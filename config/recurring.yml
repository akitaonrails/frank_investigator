production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  finish_terminal_failed_queue_jobs:
    command: "QueueMaintenance::FinishTerminalFailedJobs.call"
    schedule: every hour at minute 17
  smoke_check:
    class: Monitoring::SmokeCheckJob
    queue: default
    schedule: every 6 hours
  purge_old_errors:
    command: "ErrorReport.purge_old"
    schedule: at 3am every day
  detect_stale_claims:
    class: Claims::DetectStalenessJob
    queue: default
    schedule: every 12 hours
  reassess_stale_claims:
    class: Claims::ReassessStaleClaimsJob
    queue: default
    schedule: at 4am every day
  detect_source_corrections:
    class: Claims::DetectSourceCorrectionsJob
    queue: default
    schedule: every 12 hours
  backup_database:
    class: BackupDatabaseJob
    schedule: at 3am every day
    description: "Copy database to /content/backups/ for rsync"
  recover_stale_pipelines:
    command: "Pipeline::ResumeInterrupted.call"
    schedule: every 5 minutes
  purge_stale_broadcasts:
    command: "QueueMaintenance::PurgeStaleBroadcasts.call"
    schedule: every 5 minutes
  purge_stale_recurring_jobs:
    command: "QueueMaintenance::PurgeStaleRecurringJobs.call"
    schedule: every 15 minutes
