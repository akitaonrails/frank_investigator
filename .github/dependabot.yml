version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # Minor and patch bumps share one grouped PR per week; majors stay as
  # individual PRs (update-types excludes them) for the manual pr-bump flow.
  groups:
    bundler-minor-and-patch:
      update-types:
      - "minor"
      - "patch"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-minor-and-patch:
      update-types:
      - "minor"
      - "patch"
